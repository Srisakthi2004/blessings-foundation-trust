  <rect x="0" y="320" width="600" height="80" fill="#431407" opacity="0.85" />
  <text x="30" y="355" font-family="'Outfit', sans-serif" font-size="20" font-weight="700" fill="#ffffff">
    Food &amp; Essential Relief Drive
