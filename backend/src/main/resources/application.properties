# ===================================================================
# BLESSINGS FOUNDATION & TRUST - SPRING BOOT CONFIGURATION
# ===================================================================

# Server Configuration
server.port=8080
server.servlet.context-path=/

# MySQL Database Connection (JDBC)
spring.datasource.url=jdbc:mysql://localhost:3306/blessings_foundation?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
# Replace YOUR_PASSWORD with your local MySQL password in Eclipse / STS
spring.datasource.password=YOUR_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JDBC HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# SQL Script Initialization (Optional: can run setup.sql via MySQL Workbench or enable this)
# spring.sql.init.mode=always

# Logging configuration
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.com.blessings.foundation=INFO
